<html lang="pt-BR">
<head>

<title>Zyntra Transforma — Dashboard de Gestão Social (case de portfólio)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
  --bg: #FAFAF9;
  --bg-panel: #FFFFFF;
  --text: #262524;
  --text-muted: #666666;
  --text-faint: #999999;
  --accent: #FF5A00;
  --accent-2: #FF8A42;
  --peach: #FFC7A6;
  --peach-light: #FFE7D9;
  --accent-soft: #FFE7D9;
  --dark: #333333;
  --gray-mid: #666666;
  --gray-light: #E0E0E0;
  --line: #E0E0E0;
  --shadow: 0 1px 2px rgba(38,37,36,0.04), 0 8px 24px -12px rgba(38,37,36,0.12);
  --radius: 14px;
  --font-display: 'Inter', 'Segoe UI', sans-serif;
  --font-body: 'Inter', 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1C1B1A;
    --bg-panel: #262524;
    --text: #F4F2EF;
    --text-muted: #B0AEAB;
    --text-faint: #7A7876;
    --accent: #FF6F1F;
    --accent-2: #FF8A42;
    --peach: #B87A55;
    --peach-light: #4A362A;
    --accent-soft: #3D2A1E;
    --dark: #E0E0E0;
    --gray-mid: #B0AEAB;
    --gray-light: #3A3937;
    --line: #3A3937;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"] {
  --bg: #1C1B1A;
  --bg-panel: #262524;
  --text: #F4F2EF;
  --text-muted: #B0AEAB;
  --text-faint: #7A7876;
  --accent: #FF6F1F;
  --accent-2: #FF8A42;
  --peach: #B87A55;
  --peach-light: #4A362A;
  --accent-soft: #3D2A1E;
  --dark: #E0E0E0;
  --gray-mid: #B0AEAB;
  --gray-light: #3A3937;
  --line: #3A3937;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--font-display); margin: 0; }
button { font-family: inherit; cursor: pointer; }
::selection { background: var(--accent-soft); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ---------- Shell / layout ---------- */
.app-shell { min-height: 100vh; }
.app-main { padding: 1.75rem 1.25rem 5.5rem; max-width: 1400px; margin: 0 auto; }
@media (min-width: 768px) {
  .app-main { padding: 2.25rem 2.5rem 3rem; margin-left: 5rem; }
}
@media (min-width: 1024px) {
  .app-main { margin-left: 15.5rem; padding: 2.5rem 3rem 3rem; }
}

.sidebar-desktop {
  display: none;
}
@media (min-width: 768px) {
  .sidebar-desktop {
    display: flex; flex-direction: column;
    position: fixed; top: 0; left: 0; bottom: 0; width: 5rem;
    background: var(--dark); color: #EFECE6; z-index: 30;
    padding: 1.25rem 0.5rem;
  }
}
@media (min-width: 1024px) {
  .sidebar-desktop { width: 15.5rem; padding: 1.5rem 1.1rem; align-items: stretch; }
}
.sidebar-brand {
  display: flex; align-items: center; gap: 0.65rem; background: none; border: none;
  color: inherit; padding: 0.4rem; margin-bottom: 1.75rem; justify-content: center;
}
@media (min-width: 1024px) { .sidebar-brand { justify-content: flex-start; } }
.sidebar-brand-mark {
  width: 2.3rem; height: 2.3rem; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.sidebar-brand-text { display: none; font-family: var(--font-display); font-weight: 700; font-size: 0.85rem; line-height: 1.2; color: #fff; }
.sidebar-brand-text b { color: var(--accent); font-weight: 700; display: block; }
@media (min-width: 1024px) { .sidebar-brand-text { display: block; } }
.sidebar-nav { display: flex; flex-direction: column; gap: 0.3rem; flex: 1; }
.sidebar-item {
  display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem; border-radius: 10px;
  background: none; border: none; color: #C9C6C0; justify-content: center;
  transition: background 0.15s, color 0.15s;
}
@media (min-width: 1024px) { .sidebar-item { justify-content: flex-start; } }
.sidebar-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
.sidebar-item-active { background: var(--accent); color: #fff; }
.sidebar-item-text { display: none; font-size: 0.84rem; font-weight: 500; }
@media (min-width: 1024px) { .sidebar-item-text { display: inline; } }
.sidebar-footer { display: none; font-size: 0.68rem; color: #8A8781; line-height: 1.4; padding: 0.5rem; }
@media (min-width: 1024px) { .sidebar-footer { display: block; } }

.sidebar-mobile {
  display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  background: var(--dark); border-top: 1px solid rgba(255,255,255,0.08);
  padding: 0.35rem 0.25rem calc(0.35rem + env(safe-area-inset-bottom));
}
@media (min-width: 768px) { .sidebar-mobile { display: none; } }
.sidebar-mobile-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.15rem;
  background: none; border: none; color: #ADA9A2; font-size: 0.62rem; padding: 0.3rem 0.1rem;
  border-radius: 8px;
}
.sidebar-mobile-item-active { color: var(--accent); }

/* ---------- Topbar / page header ---------- */
.page-body { display: flex; flex-direction: column; gap: 1.25rem; }
.topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.page-title { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; }
.page-subtitle { margin: 0.2rem 0 0; color: var(--text-muted); font-size: 0.9rem; }
.back-btn {
  display: flex; align-items: center; gap: 0.35rem; background: var(--bg-panel); border: 1.5px solid var(--accent);
  color: var(--accent); padding: 0.5rem 0.9rem; border-radius: 999px; font-size: 0.82rem; font-weight: 600;
  box-shadow: var(--shadow);
}
.back-btn:hover { background: var(--accent-soft); }

/* ---------- Home ---------- */
.home-hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 3rem 1.25rem; background: var(--dark); color: #F4F2ED; }
.home-hero-inner { max-width: 880px; margin: 0 auto; width: 100%; }
.home-eyebrow { color: var(--accent); font-weight: 600; font-size: 0.85rem; margin: 0 0 0.5rem; }
.home-logo { display: flex; align-items: center; gap: 0.65rem; margin-bottom: 2rem; }
.wordmark { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; letter-spacing: -0.01em; line-height: 1; }
.wordmark span { display: block; }
.wordmark.text-xl { font-size: 1.4rem; }
.home-title { font-size: clamp(2.4rem, 7vw, 4rem); font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.9rem; }
.home-lede { color: #C9C6C0; max-width: 60ch; font-size: 1.02rem; line-height: 1.6; margin-bottom: 2.25rem; }
.home-cards { display: grid; grid-template-columns: 1fr; gap: 0.9rem; }
@media (min-width: 640px) { .home-cards { grid-template-columns: 1fr 1fr; } }
.home-card {
  text-align: left; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09);
  border-radius: var(--radius); padding: 1.35rem; display: flex; flex-direction: column; gap: 0.55rem;
  color: #EFECE6; transition: border-color 0.15s, transform 0.15s, background 0.15s;
}
.home-card:hover { border-color: var(--accent); background: rgba(232,90,40,0.08); transform: translateY(-2px); }
.home-card svg { color: var(--accent); }
.home-card-title { font-family: var(--font-display); font-weight: 600; font-size: 1.02rem; }
.home-card-desc { color: #B7B3AC; font-size: 0.85rem; line-height: 1.45; }
.home-links { display: flex; gap: 0.75rem; margin-top: 1.5rem; flex-wrap: wrap; }
.home-link {
  display: flex; align-items: center; gap: 0.45rem; background: none; border: 1px solid rgba(255,255,255,0.18);
  color: #DAD7D0; padding: 0.55rem 1rem; border-radius: 999px; font-size: 0.82rem; font-weight: 500;
}
.home-link:hover { border-color: var(--accent); color: var(--accent); }
.home-disclaimer { max-width: 880px; margin: 2.5rem auto 0; color: #8B887F; font-size: 0.74rem; line-height: 1.5; text-align: center; }

/* ---------- Filter bar ---------- */
.filter-bar {
  display: flex; flex-wrap: wrap; gap: 0.85rem; align-items: flex-end;
  background: var(--bg-panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 0.9rem 1rem; box-shadow: var(--shadow);
}
.select-field {
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 0.45rem 0.6rem;
  font-size: 0.83rem; color: var(--text); min-width: 8.5rem; width: 100%;
}
.reset-btn {
  background: none; border: 1px dashed var(--line); color: var(--text-muted); font-size: 0.78rem;
  padding: 0.48rem 0.85rem; border-radius: 8px; font-weight: 500;
}
.reset-btn:not(:disabled):hover { border-color: var(--accent); color: var(--accent); }
.reset-btn:disabled { opacity: 0.45; cursor: default; }
.primary-btn {
  display: inline-flex; align-items: center; gap: 0.4rem;
  background: var(--accent); color: #fff; border: none; padding: 0.6rem 1.1rem; border-radius: 8px;
  font-weight: 600; font-size: 0.83rem; white-space: nowrap;
}
.primary-btn:hover { filter: brightness(1.06); }
.primary-btn:disabled { opacity: 0.5; }
.secondary-btn {
  display: inline-flex; align-items: center; gap: 0.4rem;
  background: var(--bg-panel); color: var(--accent); border: 1.5px solid var(--accent);
  padding: 0.58rem 1.05rem; border-radius: 8px; font-weight: 600; font-size: 0.83rem; white-space: nowrap;
}
.secondary-btn:hover { background: var(--accent-soft); }

/* ---------- Panels / KPIs ---------- */
.panel { background: var(--bg-panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.5rem 1.6rem; box-shadow: var(--shadow); }
.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; margin-bottom: 1rem; flex-wrap: wrap; }
.panel-title { font-size: 1.05rem; font-weight: 600; }
.panel-subtitle { margin: 0.15rem 0 0; color: var(--text-muted); font-size: 0.82rem; }
.mini-title { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin: 0 0 0.6rem; }

.grid-2col { display: grid; grid-template-columns: 1fr; gap: 1.1rem; }
@media (min-width: 1024px) { .grid-2col { grid-template-columns: 0.85fr 1.15fr; } }
.grid-2col-wide { display: grid; grid-template-columns: 1fr; gap: 1.1rem; }
@media (min-width: 1024px) { .grid-2col-wide { grid-template-columns: 1.6fr 1fr; } }

.kpi-row { display: flex; flex-wrap: wrap; gap: 0.9rem; }
.kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.85rem; }
@media (min-width: 480px) { .kpi-grid { grid-template-columns: repeat(3, 1fr); } }
.kpi-stack { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1rem; }
.kpi-card {
  background: var(--bg-panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 1.1rem 1.25rem; min-width: 9rem; display: flex; align-items: flex-start;
  justify-content: space-between; gap: 0.75rem;
}
.kpi-card-text { display: flex; flex-direction: column; }
.kpi-icon {
  width: 2.15rem; height: 2.15rem; border-radius: 9px; background: var(--accent-soft);
  color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.kpi-value { font-family: var(--font-display); font-weight: 700; font-size: 1.65rem; line-height: 1.15; color: var(--dark); }
.kpi-label { font-size: 0.76rem; color: var(--text-muted); margin-top: 0.25rem; font-weight: 500; }
.kpi-sublabel { font-size: 0.68rem; color: var(--text-faint); margin-top: 0.1rem; }

/* ---------- Gauges ---------- */
.gauge-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
@media (min-width: 640px) { .gauge-grid { grid-template-columns: repeat(4, 1fr); } }
.gauge-wrap { display: flex; flex-direction: column; align-items: center; }
.gauge-svg { width: 100%; max-width: 190px; }
.gauge-text { font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; }
.gauge-label { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); text-align: center; margin-top: -0.35rem; }
.hint-text { font-size: 0.76rem; color: var(--text-faint); margin-top: 1rem; }

.gauge-note { margin-top: 1.1rem; border-top: 1px dashed var(--line); padding-top: 0.85rem; }
.gauge-note summary {
  cursor: pointer; font-size: 0.78rem; font-weight: 600; color: var(--text-muted);
  list-style: none; display: inline-flex; align-items: center; gap: 0.4rem;
}
.gauge-note summary::-webkit-details-marker { display: none; }
.gauge-note summary::before {
  content: 'i'; font-style: italic; font-family: Georgia, serif; font-weight: 700;
  width: 1.1rem; height: 1.1rem; border-radius: 50%; border: 1.3px solid currentColor;
  display: inline-flex; align-items: center; justify-content: center; font-size: 0.68rem; flex-shrink: 0;
}
.gauge-note summary:hover { color: var(--accent); }
.gauge-note[open] summary { color: var(--accent); margin-bottom: 0.15rem; }
.gauge-note-body {
  margin-top: 0.65rem; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  padding: 0.9rem 1.05rem; font-size: 0.78rem; color: var(--text-muted); line-height: 1.6; max-width: 62rem;
}
.gauge-note-body p { margin: 0 0 0.55rem; }
.gauge-note-body p:last-child { margin-bottom: 0; }
.gauge-note-body ul { margin: 0 0 0.55rem; padding-left: 1.15rem; }
.gauge-note-body li { margin-bottom: 0.3rem; }
.gauge-note-body strong { color: var(--text); font-weight: 600; }

/* ---------- Stacked bar ---------- */
.stacked-bar { display: flex; width: 100%; height: 2.1rem; border-radius: 8px; overflow: hidden; }
.stacked-seg { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.68rem; font-weight: 700; min-width: 2px; }
.legend-row { display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; margin-top: 0.6rem; font-size: 0.75rem; color: var(--text-muted); }
.legend-item { display: flex; align-items: center; gap: 0.35rem; }
.legend-dot { width: 0.55rem; height: 0.55rem; border-radius: 2px; flex-shrink: 0; }

/* ---------- Unit tabs (Território) ---------- */
.unit-tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.unit-tab {
  background: var(--bg-panel); border: 1px solid var(--line); color: var(--text-muted);
  padding: 0.5rem 1rem; border-radius: 999px; font-size: 0.82rem; font-weight: 600;
}
.unit-tab-active { background: var(--dark); border-color: var(--dark); color: #fff; }

/* ---------- Locator (mapa estilizado) ---------- */
.locator-bg { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
.locator-grid { stroke: var(--line); stroke-width: 1; opacity: 0.6; }
.locator-caption { font-size: 9px; fill: var(--text-faint); font-family: var(--font-body); text-transform: uppercase; letter-spacing: 0.04em; }
.locator-label { font-size: 9.5px; fill: var(--text-muted); font-family: var(--font-body); }
.locator-dot-group circle { transition: opacity 0.15s; }
.mini-legend-list { list-style: none; margin: 0.9rem 0 0; padding: 0; display: flex; flex-direction: column; gap: 0.4rem; }
.mini-legend-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: var(--text); }
.mini-legend-count { margin-left: auto; font-weight: 700; font-family: var(--font-display); color: var(--text-muted); }

/* ---------- Charts / tooltip ---------- */
.chart-tooltip { background: var(--dark); color: #F4F2ED; border-radius: 8px; padding: 0.55rem 0.7rem; font-size: 0.76rem; box-shadow: var(--shadow); max-width: 220px; }
.chart-tooltip-title { font-weight: 700; margin-bottom: 0.3rem; }
.chart-tooltip-row { display: flex; align-items: center; gap: 0.4rem; padding: 0.08rem 0; }
.chart-tooltip-value { margin-left: auto; font-weight: 600; }

.toggle-group { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.toggle-btn { background: var(--bg-panel); color: var(--text-muted); border: none; padding: 0.4rem 0.85rem; font-size: 0.78rem; font-weight: 600; }
.toggle-btn-active { background: var(--dark); color: #fff; }

.grid-invest { display: grid; grid-template-columns: 1fr; gap: 1.1rem; }
@media (min-width: 1024px) {
  .grid-invest { grid-template-columns: 1.1fr 0.8fr; }
  .grid-invest-chart { grid-column: 1 / -1; }
}

/* ---------- Table ---------- */
.table-scroll { overflow-x: auto; }
.data-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
.data-table th {
  text-align: left; padding: 0.55rem 0.75rem; border-bottom: 2px solid var(--line);
  color: var(--text-muted); font-weight: 700; font-size: 0.72rem; text-transform: uppercase;
  letter-spacing: 0.02em; cursor: pointer; white-space: nowrap;
}
.data-table td { padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
.data-table tbody tr:hover { background: var(--accent-soft); }
.text-right { text-align: right; }
.text-faint { color: var(--text-faint); }
.empty-row { text-align: center; color: var(--text-muted); padding: 1.5rem !important; }

/* ---------- One-page ---------- */
.onepage-header { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
.badge { background: var(--dark); color: #fff; font-size: 0.72rem; font-weight: 600; padding: 0.3rem 0.7rem; border-radius: 999px; }
.badge-outline { background: none; border: 1px solid var(--line); color: var(--text-muted); }
.meta-grid { display: grid; grid-template-columns: 1fr; gap: 0.75rem; }
@media (min-width: 640px) { .meta-grid { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1024px) { .meta-grid { grid-template-columns: 1fr 1fr 1fr; } }
.meta-card { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 0.75rem 0.9rem; display: flex; flex-direction: column; gap: 0.3rem; }
.meta-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-faint); }
.meta-value { font-size: 0.9rem; font-weight: 600; }

.mt-4 { margin-top: 1rem; } .mt-6 { margin-top: 1.5rem; } .mb-5 { margin-bottom: 1.25rem; } .mb-6 { margin-bottom: 1.5rem; }

</style>
</head>

/* ============================================================
   3. CONTEXTO DE FILTROS — fonte única de verdade (cross-filtering)
   ============================================================ */
const defaultFiltros = {
  anoInicio: ANO_MIN, anoFim: ANO_MAX,
  unidade: 'todas', frente: 'todas', tema: 'todas',
  motivo: 'todas', status: 'todos', ods: 'todas',
};
const FilterCtx = createContext(null);
function FilterProvider({ children }) {
  const [filtros, setFiltros] = useState(defaultFiltros);
  const update = (patch) => setFiltros((f) => ({ ...f, ...patch }));
  const reset = () => setFiltros(defaultFiltros);
  return <FilterCtx.Provider value={{ filtros, update, reset }}>{children}</FilterCtx.Provider>;
}
const useFiltros = () => useContext(FilterCtx);

function projetoPassa(p, filtros, skip = []) {
  if (!skip.includes('unidade') && filtros.unidade !== 'todas' && p.id_unidade !== filtros.unidade) return false;
  if (!skip.includes('frente') && filtros.frente !== 'todas' && p.id_frente !== filtros.frente) return false;
  if (!skip.includes('tema') && filtros.tema !== 'todas' && p.id_tema !== filtros.tema) return false;
  if (!skip.includes('motivo') && filtros.motivo !== 'todas' && p.id_motivo !== filtros.motivo) return false;
  if (!skip.includes('status') && filtros.status !== 'todos' && String(p.codigo_status) !== String(filtros.status)) return false;
  if (!skip.includes('ano') && (p.ano_referencia < filtros.anoInicio || p.ano_referencia > filtros.anoFim)) return false;
  if (!skip.includes('ods') && filtros.ods !== 'todas') {
    const lst = odsByProjeto[p.id_projeto] || [];
    if (!lst.includes(filtros.ods)) return false;
  }
  return true;
}

/* --- Gauge semicircular (substitui o visual custom do Power BI) --- */
function polar(cx, cy, r, angleDeg) {
  const rad = (Math.PI / 180) * angleDeg;
  return { x: cx + r * Math.cos(rad), y: cy - r * Math.sin(rad) };
}
function gaugeArc(cx, cy, r, fraction) {
  const start = polar(cx, cy, r, 180);
  const end = polar(cx, cy, r, 180 - 180 * Math.max(0, Math.min(1, fraction)));
  return `M ${start.x} ${start.y} A ${r} ${r} 0 0 1 ${end.x} ${end.y}`;
}
function Gauge({ label, value }) {
  const has = value !== null && value !== undefined && !Number.isNaN(value);
  const frac = has ? Math.max(0, Math.min(1, value / 100)) : 0;
  const over = has && value > 100;
  return (
    <div className="gauge-wrap" title={has ? `${label}: ${fmtPct(value, 0)}` : `${label}: sem meta cadastrada`}>
      <svg viewBox="0 0 200 118" className="gauge-svg">
        <path d={gaugeArc(100, 104, 78, 1)} fill="none" stroke="var(--line)" strokeWidth="15" strokeLinecap="round" />
        {has && (
          <path d={gaugeArc(100, 104, 78, frac)} fill="none"
            stroke={over ? 'var(--dark)' : 'var(--accent)'} strokeWidth="15" strokeLinecap="round" />
        )}
        <text x="100" y="94" textAnchor="middle" className="gauge-text" fill={has ? 'var(--text)' : 'var(--text-faint)'}>
          {has ? `${Math.round(value)}%` : '—'}
        </text>
      </svg>
      <div className="gauge-label">{label}</div>
    </div>
  );
}

/* --- Nota de metodologia — regra de negócio dos indicadores de aderência --- */
function GaugeNote({ mode = 'single' }) {
  return (
    <details className="gauge-note">

        </p>

          <li><strong>Resultado</strong> — entrega dos produtos/resultados previstos no plano de trabalho; pode superar 100%.</li>

  );
}

/* --- Locator estilizado das unidades (substitui o mapa de tiles) --- */
const LATS = DATA.dim_unidade.map((u) => u.lat);
const LONS = DATA.dim_unidade.map((u) => u.lon);
const LAT_MIN = Math.min(...LATS) - 0.35, LAT_MAX = Math.max(...LATS) + 0.35;
const LON_MIN = Math.min(...LONS) - 0.35, LON_MAX = Math.max(...LONS) + 0.35;
function projectXY(u, w, h, pad) {
  const x = pad + ((u.lon - LON_MIN) / (LON_MAX - LON_MIN)) * (w - 2 * pad);
  const y = pad + (1 - (u.lat - LAT_MIN) / (LAT_MAX - LAT_MIN)) * (h - 2 * pad);
  return { x, y };
}
function UnitLocator({ sizeByUnidade, highlightId, onSelect, compact = false }) {
  const w = 320, h = compact ? 190 : 240, pad = 34;
  const maxMetric = Math.max(1, ...Object.values(sizeByUnidade || {}));
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-auto">
      <rect x="2" y="2" width={w - 4} height={h - 4} rx="16" className="locator-bg" />
      {Array.from({ length: 6 }).map((_, r) => (
        <line key={`h${r}`} x1="14" x2={w - 14} y1={14 + (r * (h - 28)) / 5} y2={14 + (r * (h - 28)) / 5} className="locator-grid" />
      ))}
      {Array.from({ length: 7 }).map((_, c) => (
        <line key={`v${c}`} y1="14" y2={h - 14} x1={14 + (c * (w - 28)) / 6} x2={14 + (c * (w - 28)) / 6} className="locator-grid" />
      ))}
      <text x="16" y="24" className="locator-caption">MG — unidades Zyntra</text>
      {DATA.dim_unidade.map((u) => {
        const { x, y } = projectXY(u, w, h, pad + 8);
        const metric = sizeByUnidade ? (sizeByUnidade[u.id_unidade] || 0) : null;
        const r = sizeByUnidade ? 6 + 12 * (metric / maxMetric) : 7;
        const active = highlightId === u.id_unidade;
        return (
          <g key={u.id_unidade} className="locator-dot-group" style={{ cursor: onSelect ? 'pointer' : 'default' }}
            onClick={() => onSelect && onSelect(active ? 'todas' : u.id_unidade)}>
            <circle cx={x} cy={y} r={r + (active ? 4 : 0)} fill={UNIDADE_COLORS[u.id_unidade]}
              opacity={active || !highlightId || highlightId === 'todas' ? 0.92 : 0.25} />
            {active && <circle cx={x} cy={y} r={r + 8} fill="none" stroke={UNIDADE_COLORS[u.id_unidade]} strokeWidth="1.5" opacity="0.6" />}
            <title>{u.nome_unidade}{metric !== null ? ` — ${fmtInt(metric)}` : ''}</title>
            <text x={x} y={y + r + 13} textAnchor="middle" className="locator-label">{u.municipio}</text>
          </g>
        );
      })}
    </svg>
  );
}

function ChartTooltip({ active, payload, label, formatter }) {
  if (!active || !payload || !payload.length) return null;

        </div>
      ))}
    </div>
  );
}

  const rows = DATA.fact_aderencia_indicador.filter((r) => idsProjetos.includes(r.id_projeto));
  const out = {};
  TIPOS_INDICADOR.forEach((t) => {
    const vals = rows.filter((r) => r.tipo_indicador === t).map((r) => r.pct_aderencia);
    out[t] = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  });
  return out;
}

function AderenciaPage({ setPage }) {
  const { filtros, update } = useFiltros();
  const elegiveis = useMemo(
    () => DATA.dim_projeto.filter((p) => projetoPassa(p, filtros) && p.codigo_status >= 5),
    [filtros]
  );
  const [projetoSel, setProjetoSel] = useState('todos');

  useEffect(() => {
    if (projetoSel !== 'todos' && !elegiveis.some((p) => p.id_projeto === projetoSel)) setProjetoSel('todos');
  }, [elegiveis]);

  const valores = useMemo(() => {
    if (projetoSel === 'todos') return aderenciaMedia(elegiveis.map((p) => p.id_projeto));
    return aderenciaMedia([projetoSel]);
  }, [projetoSel, elegiveis]);

  return (
    <div className="page-body">
      <TopBar title="Indicadores de Aderência dos Projetos Sociais" subtitle="impacto, resultado, avanço físico e execução financeira" />
      <FilterBar show={['ano', 'unidade', 'frente', 'status']}
        extraRight={<button onClick={() => setPage("aderencia-detalhe")} className="primary-btn">Ver detalhamento completo <IconChevron className="w-4 h-4" /></button>} />

      <Panel>
        <div className="mb-5 max-w-sm">
          <Field label="Projeto">
            <select className="select-field" value={projetoSel} onChange={(e) => setProjetoSel(e.target.value)}>
              <option value="todos">Média da seleção atual ({elegiveis.length} projetos)</option>
              {elegiveis.map((p) => <option key={p.id_projeto} value={p.id_projeto}>{p.nome_ficticio_projeto}</option>)}
            </select>
          </Field>
        </div>
        <div className="gauge-grid">
          {TIPOS_INDICADOR.map((t) => <Gauge key={t} label={t} value={valores[t]} />)}
        </div>
        {projetoSel === 'todos' && (
          <p className="hint-text">Exibindo a média dos indicadores entre os {elegiveis.length} projetos contratados que atendem aos filtros atuais.</p>
        )}
        <GaugeNote mode={projetoSel === 'todos' ? 'aggregate' : 'single'} />
      </Panel>
    </div>
  );
}

/* ============================================================
   10. PÁGINA — ADERÊNCIA · DETALHAMENTO (tabela)
   ============================================================ */
function AderenciaDetalhePage() {
  const { filtros } = useFiltros();
  const projetos = useMemo(
    () => DATA.dim_projeto.filter((p) => projetoPassa(p, filtros) && p.codigo_status >= 5),
    [filtros]
  );
  const medias = useMemo(() => aderenciaMedia(projetos.map((p) => p.id_projeto)), [projetos]);

  const linhas = useMemo(() => {
    return projetos.map((p) => {
      const regs = DATA.fact_aderencia_indicador.filter((r) => r.id_projeto === p.id_projeto);
      const row = { id: p.id_projeto, nome: p.nome_ficticio_projeto, unidade: unidadeById[p.id_unidade].nome_unidade };
      TIPOS_INDICADOR.forEach((t) => {
        const r = regs.find((x) => x.tipo_indicador === t);
        row[t] = r ? r.pct_aderencia : null;
      });
      return row;
    }).filter((r) => TIPOS_INDICADOR.some((t) => r[t] !== null));
  }, [projetos]);

  const [sort, setSort] = useState({ key: 'nome', dir: 1 });
  const linhasOrdenadas = useMemo(() => {
    const arr = [...linhas];
    arr.sort((a, b) => {
      const va = a[sort.key], vb = b[sort.key];
      if (va === null) return 1;
      if (vb === null) return -1;
      if (typeof va === 'string') return va.localeCompare(vb) * sort.dir;
      return (va - vb) * sort.dir;
    });
    return arr;
  }, [linhas, sort]);

  const toggleSort = (key) => setSort((s) => ({ key, dir: s.key === key ? -s.dir : 1 }));

  return (
    <div className="page-body">
      <TopBar title="Indicadores de Aderência — Detalhamento" subtitle="visão analítica por projeto" />
      <FilterBar show={['ano', 'unidade', 'status']} />

      <Panel subtitle={`${linhas.length} projetos com indicador cadastrado`}>
        <div className="gauge-grid mb-6">
          {TIPOS_INDICADOR.map((t) => <Gauge key={t} label={t} value={medias[t]} />)}
        </div>
        <GaugeNote mode="aggregate" />
        <div className="table-scroll">
          <table className="data-table">
            <thead>
              <tr>
                <th onClick={() => toggleSort('nome')}>Projeto {sort.key === 'nome' ? (sort.dir > 0 ? '▲' : '▼') : ''}</th>
                <th onClick={() => toggleSort('unidade')}>Unidade {sort.key === 'unidade' ? (sort.dir > 0 ? '▲' : '▼') : ''}</th>
                {TIPOS_INDICADOR.map((t) => (
                  <th key={t} className="text-right" onClick={() => toggleSort(t)}>
                    {t} {sort.key === t ? (sort.dir > 0 ? '▲' : '▼') : ''}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {linhasOrdenadas.map((r) => (
                <tr key={r.id}>
                  <td>{r.nome}</td>
                  <td>{r.unidade}</td>
                  {TIPOS_INDICADOR.map((t) => (
                    <td key={t} className="text-right">{r[t] !== null ? fmtPct(r[t], 0) : <span className="text-faint">—</span>}</td>
                  ))}
                </tr>
              ))}
              {!linhasOrdenadas.length && (
                <tr><td colSpan={6} className="empty-row">Nenhum projeto com indicador cadastrado para os filtros atuais.</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </Panel>
    </div>
  );
}

/* ============================================================
   11. PÁGINA — INVESTIMENTO SOCIAL
   ============================================================ */
function InvestimentoPage() {
  const { filtros } = useFiltros();
  const [modo, setModo] = useState('mes');

  const projetos = useMemo(() => DATA.dim_projeto.filter((p) => projetoPassa(p, filtros, ['status', 'ods'])), [filtros]);
  const idsProjetos = useMemo(() => new Set(projetos.map((p) => p.id_projeto)), [projetos]);

  const investFiltrado = useMemo(() => {
    return DATA.fact_investimento_mensal.filter((r) => {
      if (!idsProjetos.has(r.id_projeto)) return false;
      const ano = Number(r.mes_ano.slice(0, 4));
      return ano >= filtros.anoInicio && ano <= filtros.anoFim;
    });
  }, [idsProjetos, filtros.anoInicio, filtros.anoFim]);

  const orcamentoTotal = useMemo(() => projetos.reduce((s, p) => s + p.orcamento_total, 0), [projetos]);
  const realizado = useMemo(() => investFiltrado.filter((r) => r.status_pagamento === 'Realizado').reduce((s, r) => s + r.valor, 0), [investFiltrado]);
  const rf = useMemo(() => investFiltrado.filter((r) => r.status_pagamento === 'RF').reduce((s, r) => s + r.valor, 0), [investFiltrado]);
  const pctRealizado = orcamentoTotal > 0 ? (realizado / orcamentoTotal) * 100 : null;

  const rankingUnidade = useMemo(() => {
    const m = {};
    investFiltrado.forEach((r) => {
      if (r.status_pagamento === 'Realizado' || r.status_pagamento === 'RF') {
        const uid = DATA.dim_projeto.find((p) => p.id_projeto === r.id_projeto)?.id_unidade;
        if (uid) m[uid] = (m[uid] || 0) + r.valor;
      }
    });
    return DATA.dim_unidade
      .map((u) => ({ unidade: u.nome_unidade, id: u.id_unidade, valor: m[u.id_unidade] || 0 }))
      .sort((a, b) => b.valor - a.valor);
  }, [investFiltrado]);

  const projetoToUnidade = useMemo(() => by(DATA.dim_projeto, 'id_projeto'), []);

  const serieTemporal = useMemo(() => {
    const meses = [...new Set(investFiltrado.map((r) => r.mes_ano))].sort();
    return meses.map((m) => {
      const rows = investFiltrado.filter((r) => r.mes_ano === m);
      const val = (status) => rows.filter((r) => r.status_pagamento === status).reduce((s, r) => s + r.valor, 0);
      return { chave: fmtMesAno(m), Realizado: val('Realizado'), RF: val('RF'), Previsto: val('Previsto') };
    });
  }, [investFiltrado]);

  const serieUnidade = useMemo(() => {
    return rankingUnidade.map((u) => {
      const rows = investFiltrado.filter((r) => projetoToUnidade[r.id_projeto]?.id_unidade === u.id);
      const val = (status) => rows.filter((r) => r.status_pagamento === status).reduce((s, r) => s + r.valor, 0);
      return { chave: u.unidade, Realizado: val('Realizado'), RF: val('RF'), Previsto: val('Previsto') };
    });
  }, [rankingUnidade, investFiltrado, projetoToUnidade]);

  const serieAtiva = modo === 'mes' ? serieTemporal : serieUnidade;

  return (
    <div className="page-body">
      <TopBar title="Análise do Investimento Social" subtitle="orçamento, execução financeira e evolução mensal" />
      <FilterBar show={['ano', 'unidade', 'tema', 'frente']} />

      <div className="grid-invest">
        <Panel title="Investimento realizado por unidade" className="grid-invest-rank">
          <div className="h-64">
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={rankingUnidade} layout="vertical" margin={{ top: 4, right: 24, left: 8, bottom: 4 }}>
                <CartesianGrid strokeDasharray="3 3" stroke="var(--line)" horizontal={false} />
                <XAxis type="number" tickFormatter={fmtBRLMi} tick={{ fontSize: 11, fill: 'var(--text-muted)' }} />
                <YAxis type="category" dataKey="unidade" width={150} tick={{ fontSize: 11, fill: 'var(--text-muted)' }} />
                <Tooltip content={<ChartTooltip formatter={fmtBRLFull} />} cursor={{ fill: 'var(--accent-soft)' }} />
                <Bar dataKey="valor" name="Realizado + RF" radius={[0, 4, 4, 0]}>
                  {rankingUnidade.map((u) => <Cell key={u.id} fill={UNIDADE_COLORS[u.id]} />)}
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>
        </Panel>

        <Panel title="Orçamento realizado" className="grid-invest-gauge">
          <Gauge label="% do orçamento executado" value={pctRealizado} />
          <div className="kpi-stack">
            <KpiCard label="Orçamento total" value={fmtBRLMi(orcamentoTotal)} icon={IconCoin} />
            <KpiCard label="Realizado" value={fmtBRLMi(realizado)} tone="accent" icon={IconTrend} />
            <KpiCard label="RF (reservado financeiro)" value={fmtBRLMi(rf)} />
          </div>
        </Panel>

        <Panel title="Realizado + RF + Previsto" className="grid-invest-chart"
          right={
            <div className="toggle-group">
              <button className={`toggle-btn ${modo === 'mes' ? 'toggle-btn-active' : ''}`} onClick={() => setModo('mes')}>Mês</button>
              <button className={`toggle-btn ${modo === 'unidade' ? 'toggle-btn-active' : ''}`} onClick={() => setModo('unidade')}>Unidade</button>
            </div>
          }>
          <div className="h-72">
            <ResponsiveContainer width="100%" height="100%">
              <ComposedChart data={serieAtiva} margin={{ top: 8, right: 16, left: -12, bottom: 0 }}>
                <CartesianGrid strokeDasharray="3 3" stroke="var(--line)" vertical={false} />
                <XAxis dataKey="chave" tick={{ fontSize: 11, fill: 'var(--text-muted)' }}
                  angle={modo === 'unidade' ? -14 : 0} textAnchor={modo === 'unidade' ? 'end' : 'middle'}
                  height={modo === 'unidade' ? 46 : 28} />
                <YAxis tickFormatter={fmtBRLMi} tick={{ fontSize: 11, fill: 'var(--text-muted)' }} />
                <Tooltip content={<ChartTooltip formatter={fmtBRLFull} />} />
                <Legend wrapperStyle={{ fontSize: 12 }} />
                <Bar dataKey="Realizado" stackId="a" fill="var(--accent)" radius={[0, 0, 0, 0]} />
                <Bar dataKey="RF" stackId="a" fill="var(--dark)" radius={[3, 3, 0, 0]} />
                <Line type="monotone" dataKey="Previsto" stroke="var(--dark)" strokeDasharray="5 4" strokeWidth={2} dot={{ r: 3 }} />
              </ComposedChart>
            </ResponsiveContainer>
          </div>
        </Panel>
      </div>
    </div>
  );
}

/* ============================================================
   12. PÁGINA — ONE-PAGE DO PROJETO
   ============================================================ */
function OnePagePage({ selectedProjeto, setSelectedProjeto }) {
  const projetoAtual = selectedProjeto
    ? DATA.dim_projeto.find((p) => p.id_projeto === selectedProjeto)
    : DATA.dim_projeto[0];

  const aderencia = useMemo(() => {
    const rows = DATA.fact_aderencia_indicador.filter((r) => r.id_projeto === projetoAtual.id_projeto);
    const out = {};
    TIPOS_INDICADOR.forEach((t) => {
      const r = rows.find((x) => x.tipo_indicador === t);
      out[t] = r ? r.pct_aderencia : null;
    });
    return out;
  }, [projetoAtual]);

  const unidade = unidadeById[projetoAtual.id_unidade];
  const odsProjeto = (odsByProjeto[projetoAtual.id_projeto] || []).map((id) => odsById[id]);

  return (
    <div className="page-body">
      <TopBar title="One-page do Projeto" subtitle="ficha-resumo com metadados e indicadores" />

      <Panel>
        <div className="mb-5 max-w-lg">
          <Field label="Selecione um projeto">
            <select className="select-field" value={projetoAtual.id_projeto}
              onChange={(e) => setSelectedProjeto(e.target.value)}>
              {DATA.dim_projeto.map((p) => (
                <option key={p.id_projeto} value={p.id_projeto}>{p.nome_ficticio_projeto}</option>
              ))}
            </select>
          </Field>
        </div>

        <div className="onepage-header">
          <span className="badge">{statusByCode[projetoAtual.codigo_status].nome_status}</span>
          <span className="badge badge-outline">{projetoAtual.ano_referencia}</span>
          <span className="badge badge-outline">{unidade.nome_unidade}</span>
        </div>

        <div className="meta-grid">
          <div className="meta-card"><span className="meta-label">Tema estratégico</span><span className="meta-value">{temaById[projetoAtual.id_tema].nome_tema}</span></div>
          <div className="meta-card"><span className="meta-label">Frente de atuação</span><span className="meta-value">{frenteById[projetoAtual.id_frente].nome_frente}</span></div>
          <div className="meta-card"><span className="meta-label">Motivo do projeto</span><span className="meta-value">{motivoById[projetoAtual.id_motivo].nome_motivo}</span></div>
          <div className="meta-card">
            <span className="meta-label">Programa</span>
            <span className="meta-value">{projetoAtual.id_programa ? programaById[projetoAtual.id_programa].nome_programa : 'Sem programa vinculado'}</span>
          </div>
          <div className="meta-card"><span className="meta-label">Orçamento total</span><span className="meta-value">{fmtBRLMi(projetoAtual.orcamento_total)}</span></div>
          <div className="meta-card">
            <span className="meta-label">ODS relacionados</span>
            <span className="meta-value flex flex-wrap gap-1.5">
              {odsProjeto.map((o) => <span key={o.id_ods} className="badge badge-outline" style={{ fontSize: '0.68rem' }}>{o.nome_ods}</span>)}
            </span>
          </div>
        </div>

        <p className="mini-title mt-6">Aderência aos indicadores</p>
        <div className="gauge-grid">
          {TIPOS_INDICADOR.map((t) => <Gauge key={t} label={t} value={aderencia[t]} />)}
        </div>
        <GaugeNote mode="single" />
      </Panel>
    </div>
  );
}

/* ============================================================
   13. APP RAIZ
   ============================================================ */
function AppInner() {
  const [page, setPageRaw] = useState(() => window.location.hash.replace('#', '') || 'home');
  const [selectedProjeto, setSelectedProjeto] = useState(null);

  const setPage = (p) => {
    setPageRaw(p);
    window.scrollTo(0, 0);
  };

  useEffect(() => { window.location.hash = page; }, [page]);
  useEffect(() => {
    const onHash = () => setPageRaw(window.location.hash.replace('#', '') || 'home');
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const pages = {
    home: <HomePage setPage={setPage} />,
    territorio: <TerritorioPage />,
    projetos: <ProjetosPage setPage={setPage} setSelectedProjeto={setSelectedProjeto} />,
    aderencia: <AderenciaPage setPage={setPage} />,
    'aderencia-detalhe': <AderenciaDetalhePage />,
    investimento: <InvestimentoPage />,
    onepage: <OnePagePage selectedProjeto={selectedProjeto} setSelectedProjeto={setSelectedProjeto} />,
  };

  const isHome = page === 'home';

  return (
    <div className={`app-shell ${isHome ? 'app-shell-home' : ''}`}>
      {!isHome && <Sidebar page={page} setPage={setPage} />}
      <main className={isHome ? '' : 'app-main'}>
        {pages[page] || pages.home}
      </main>
    </div>
  );
}

function App() {
  return (
    <FilterProvider>
      <AppInner />
    </FilterProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
