<style>
  :root {

      --text-primary: #EAF3ED;
      --text-secondary: #9FB0A8;
      --border-subtle: rgba(255,255,255,0.08);
    }
  }
  :root[data-theme="dark"] {
    --bg-page: #121A16;
    --bg-card: #1B2420;
    --bg-card-soft: #1F2B25;

  }
  :root {
    --accent-deep: #1F5A45;

    --accent-red: #B94F49;
    --accent-yellow: #8A6A1B;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --accent-deep: #7ED4AC;
      --accent-mid: #8FD1AE;
      --accent-petrol: #86C8D1;
      --accent-terracotta: #E8A57A;
      --accent-green: #7ED4A8;
      --accent-red: #E8938D;
      --accent-yellow: #E8C878;
    }
  }
  :root[data-theme="dark"] {
    --accent-deep: #7ED4AC;
    --accent-mid: #8FD1AE;

    --accent-red: #E8938D;
    --accent-yellow: #E8C878;
  }

  html, body, #root { height: 100%; }
  body { background: var(--bg-page); color: var(--text-primary); margin: 0; }
  .card { background: var(--bg-card); border-color: var(--border-subtle); }
  .card-soft { background: var(--bg-card-soft); }
  .text-main { color: var(--text-primary); }
  .text-muted { color: var(--text-secondary); }
  .border-subtle { border-color: var(--border-subtle); }
  .text-accent-deep { color: var(--accent-deep); }
  .text-accent-mid { color: var(--accent-mid); }
  .text-accent-petrol { color: var(--accent-petrol); }
  .text-accent-terracotta { color: var(--accent-terracotta); }
  .text-accent-green { color: var(--accent-green); }
  .text-accent-red { color: var(--accent-red); }
  .text-accent-yellow { color: var(--accent-yellow); }
  .thin-scrollbar::-webkit-scrollbar { height: 6px; }
  .thin-scrollbar::-webkit-scrollbar-thumb { background-color: #C9D3CC; border-radius: 999px; }

  /* selects customizados: nunca usar a caixa branca nativa do navegador */
  .select-wrap { position: relative; display: inline-block; }
  .select-wrap::after {
    content: "▾";
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    color: var(--text-secondary);
    pointer-events: none;
  }
  .themed-select {
    appearance: none;
    -webkit-appearance: none;
