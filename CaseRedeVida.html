<script type="text/babel" data-presets="react">
// ============================================================================
// 0. ATALHOS GLOBAIS
// ============================================================================
const e = React.createElement;
const { useState, useMemo, useEffect, useRef, Fragment } = React;
const RC = Recharts;
// ============================================================================
// 1. DADOS — parsing do dataset embutido + índices auxiliares
// ============================================================================
const RAW = JSON.parse(document.getElementById('app-data').textContent);
const T = RAW.tabelas;
const META = RAW.meta;

const regioes = T.dim_regiao;
const organizacoes = T.dim_organizacao;
const iniciativas = T.dim_iniciativa;
const factBenef = T.fact_beneficiarios_ano;
const factValor = T.fact_valor_ano;
const bridgeTemasOrg = T.bridge_temas_atuacao_org;
const bridgeTemasSaude = T.bridge_temas_saude;
const bridgePilares = T.bridge_pilares_intervencao;
const bridgePerfil = T.bridge_perfil_beneficiarios;
const factDoacoes = T.fact_doacoes_produto;

// índices id -> registro
const regiaoPorId = {};
regioes.forEach(r => { regiaoPorId[r.id_regiao] = r; });
const orgPorId = {};
organizacoes.forEach(o => { orgPorId[o.id_organizacao] = o; });
const iniciativaPorId = {};
iniciativas.forEach(i => { iniciativaPorId[i.id_iniciativa] = i; });

// junta campos derivados úteis em cada iniciativa (macrorregião de atuação, org)
iniciativas.forEach(i => {
  const reg = regiaoPorId[i.id_regiao_atuacao];
  i._macrorregiao = reg ? reg.macrorregiao : 'Não informado';
  i._municipio = reg ? reg.municipio : null;
  i._uf = reg ? reg.uf : null;
  const org = orgPorId[i.id_organizacao];
  i._orgNome = org ? org.nome_ficticio : '—';
  i._orgTipo = org ? org.tipo_organizacao : '—';
});
organizacoes.forEach(o => {
  const reg = regiaoPorId[o.id_regiao_sede];
  o._macrorregiao = reg ? reg.macrorregiao : 'Não informado';
  o._municipio = reg ? reg.municipio : null;
  o._uf = reg ? reg.uf : null;
});

const ANO_MIN = 2008;
const ANO_MAX = 2026;

// ============================================================================
// 2. FILTROS — estado padrão e função de aplicação
// ============================================================================
// Duas semânticas de associação ao filtro são necessárias:
//  (a) "por origem" — usada para SOMAS de séries anuais (beneficiários/valor por ano,
//      por origem/modalidade/região). Cada linha da série já tem seu próprio "ano" e é
//      recortada diretamente pelo intervalo; a associação da iniciativa aqui verifica
//      somente a origem do recurso, para não excluir indevidamente linhas de anos válidos
//      pertencentes a iniciativas mais antigas.
//  (b) "completa" — usada para contagens e quebras categóricas (tipo/porte, região, temas,
//      pilares, tempo de apoio etc.), onde não há uma linha por ano para recortar. Aqui a
//      iniciativa só "pertence" ao período se o seu ANO DE APOIO (início) está dentro do
//      intervalo selecionado — isso garante que MOVER QUALQUER PONTA do slider de anos
//      (não só a direita) realmente inclua/exclua iniciativas visivelmente.
const FILTROS_PADRAO = {
  anoInicio: ANO_MIN,
  anoFim: ANO_MAX,
  origens: [], // vazio = todas
};

function iniciativaPassaOrigem(ini, filtros) {
  if (filtros.origens && filtros.origens.length > 0 && !filtros.origens.includes(ini.origem_recurso)) {
    return false;
  }
  return true;
}

function iniciativaPassaFiltro(ini, filtros) {
  if (!iniciativaPassaOrigem(ini, filtros)) return false;
  return ini.ano_apoio >= filtros.anoInicio && ini.ano_apoio <= filtros.anoFim;
}

// conjunto "completo" (origem + ano de apoio dentro do intervalo) — para contagens e categorias
function getIniciativasFiltradas(filtros) {
  return iniciativas.filter(i => iniciativaPassaFiltro(i, filtros));
}

// conjunto "por origem" apenas — para somas de séries anuais, onde o recorte de ano já
// acontece linha a linha (fact_beneficiarios_ano / fact_valor_ano)
function getIniciativasPorOrigem(filtros) {
  return iniciativas.filter(i => iniciativaPassaOrigem(i, filtros));
}

// ============================================================================
// 3. SELETORES — funções puras de agregação (recebem filtros, devolvem dados prontos p/ gráfico)
// ============================================================================

function selectKpis(filtros) {
  // contagens (organizações/iniciativas/municípios): usam associação "completa" —
  // respondem a QUALQUER ponta do intervalo de anos (ano de apoio dentro do período)
  const inisCompleto = getIniciativasFiltradas(filtros);
  const orgSet = new Set(inisCompleto.map(i => i.id_organizacao));
  const regSet = new Set(inisCompleto.map(i => i.id_regiao_atuacao));

  // somas (beneficiários/valor): usam associação "por origem" + recorte linha a linha por
  // ano, para não excluir anos válidos de iniciativas mais antigas
  const inisOrigem = getIniciativasPorOrigem(filtros);
  const idsOrigem = new Set(inisOrigem.map(i => i.id_iniciativa));

  let beneficiarios = 0;
  factBenef.forEach(f => {
    if (idsOrigem.has(f.id_iniciativa) && f.ano >= filtros.anoInicio && f.ano <= filtros.anoFim) {
      beneficiarios += f.publico_atendido;
    }
  });
  let valor = 0;
  factValor.forEach(f => {
    if (idsOrigem.has(f.id_iniciativa) && f.ano >= filtros.anoInicio && f.ano <= filtros.anoFim) {
      valor += f.valor_aportado;
    }
  });

  return {
    organizacoes: orgSet.size,
    iniciativas: inisCompleto.length,
    beneficiarios,
    valor,
    municipios: regSet.size,
  };
}

function selectBeneficiariosPorAno(filtros) {
  const inis = getIniciativasPorOrigem(filtros);
  const idsSet = new Set(inis.map(i => i.id_iniciativa));
  const acc = {};
  factBenef.forEach(f => {
    if (idsSet.has(f.id_iniciativa) && f.ano >= filtros.anoInicio && f.ano <= filtros.anoFim) {
      acc[f.ano] = (acc[f.ano] || 0) + f.publico_atendido;
    }
  });
  return Object.keys(acc).map(Number).sort((a, b) => a - b).map(ano => ({ ano: String(ano), valor: acc[ano] }));
}

function selectValorPorAno(filtros) {
  const inis = getIniciativasPorOrigem(filtros);
  const idsSet = new Set(inis.map(i => i.id_iniciativa));
  const acc = {};
  factValor.forEach(f => {
    if (idsSet.has(f.id_iniciativa) && f.ano >= filtros.anoInicio && f.ano <= filtros.anoFim) {
      acc[f.ano] = (acc[f.ano] || 0) + f.valor_aportado;
    }
  });
  return Object.keys(acc).map(Number).sort((a, b) => a - b).map(ano => ({ ano: String(ano), valor: acc[ano] }));
}

// distribuição ponderada (por público total da iniciativa) de uma dimensão de perfil
function selectPerfilDimensao(filtros, dimensao) {
  const inis = getIniciativasFiltradas(filtros);
  const idsSet = new Set(inis.map(i => i.id_iniciativa));
  const pesoPorIniciativa = {};
  inis.forEach(i => { pesoPorIniciativa[i.id_iniciativa] = Math.max(i.publico_total_atendido, 1); });

  const acc = {};
  bridgePerfil.forEach(r => {
    if (r.dimensao !== dimensao || !idsSet.has(r.id_iniciativa) || r.peso_pct === null || r.peso_pct === undefined) return;
    const w = pesoPorIniciativa[r.id_iniciativa] || 1;
    acc[r.categoria] = (acc[r.categoria] || 0) + r.peso_pct * w;
  });
  const total = Object.values(acc).reduce((s, v) => s + v, 0) || 1;
  return Object.keys(acc)
    .map(cat => ({ nome: cat, valor: acc[cat] / total * 100 }))
    .sort((a, b) => b.valor - a.valor);
}

// grupo afirmativo — múltipla escolha, calculado como % de iniciativas que citam a categoria
function selectGrupoAfirmativo(filtros) {
  const inis = getIniciativasFiltradas(filtros);
  const idsSet = new Set(inis.map(i => i.id_iniciativa));
  const total = idsSet.size || 1;
  const acc = {};
  bridgePerfil.forEach(r => {
    if (r.dimensao !== 'grupo_afirmativo' || !idsSet.has(r.id_iniciativa)) return;
    acc[r.categoria] = (acc[r.categoria] || 0) + 1;
  });
  return Object.keys(acc)
    .map(cat => ({ nome: cat, valor: acc[cat] / total * 100 }))
    .sort((a, b) => b.valor - a.valor);
}

function selectOrganizacoesFiltradas(filtros) {
  const inis = getIniciativasFiltradas(filtros);
  const orgIds = new Set(inis.map(i => i.id_organizacao));
  return organizacoes.filter(o => orgIds.has(o.id_organizacao));
}

function selectTipoPorte(filtros) {
  const orgs = selectOrganizacoesFiltradas(filtros);
  const acc = {};
  orgs.forEach(o => {
    const key = o.tipo_organizacao + ' · ' + o.porte;
    if (!acc[key]) acc[key] = { nome: key, tipo: o.tipo_organizacao, porte: o.porte, valor: 0 };
    acc[key].valor += 1;
  });
  return Object.values(acc).sort((a, b) => b.valor - a.valor);
}

function selectRegiaoOrganizacoes(filtros) {
  const orgs = selectOrganizacoesFiltradas(filtros);
  const acc = {};
  orgs.forEach(o => { acc[o._macrorregiao] = (acc[o._macrorregiao] || 0) + 1; });
  return Object.keys(acc).map(nome => ({ nome, valor: acc[nome] })).sort((a, b) => b.valor - a.valor);
}

function selectMapaOrganizacoes(filtros) {
  const orgs = selectOrganizacoesFiltradas(filtros);
  const acc = {};
  orgs.forEach(o => {
    const reg = regiaoPorId[o.id_regiao_sede];
    if (!reg) return;
    if (!acc[reg.id_regiao]) acc[reg.id_regiao] = { ...reg, count: 0 };
    acc[reg.id_regiao].count += 1;
  });
  return Object.values(acc);
}

function selectNivelAtencaoOrg(filtros) {
  const orgs = selectOrganizacoesFiltradas(filtros);
  const acc = {};
  orgs.forEach(o => { acc[o.nivel_atencao_saude_org] = (acc[o.nivel_atencao_saude_org] || 0) + 1; });
  return Object.keys(acc).map(nome => ({ nome, valor: acc[nome] })).sort((a, b) => b.valor - a.valor);
}

function selectTemasAtuacaoOrg(filtros) {
  const orgs = selectOrganizacoesFiltradas(filtros);
  const orgIds = new Set(orgs.map(o => o.id_organizacao));
  const acc = {};
  bridgeTemasOrg.forEach(r => {
    if (!orgIds.has(r.id_organizacao)) return;
    acc[r.tema_atuacao] = (acc[r.tema_atuacao] || 0) + 1;
  });
  return Object.keys(acc).map(nome => ({ nome, valor: acc[nome] })).sort((a, b) => b.valor - a.valor);
}

function selectOrigemParceria(filtros) {
  const orgs = selectOrganizacoesFiltradas(filtros);
  const acc = {};
  orgs.forEach(o => { acc[o.origem_parceria] = (acc[o.origem_parceria] || 0) + 1; });
  return Object.keys(acc).map(nome => ({ nome, valor: acc[nome] })).sort((a, b) => b.valor - a.valor);
}

function selectMapaIniciativas(filtros) {
  const inis = getIniciativasFiltradas(filtros);
  const acc = {};
  inis.forEach(i => {
    const reg = regiaoPorId[i.id_regiao_atuacao];
    if (!reg) return;
    if (!acc[reg.id_regiao]) acc[reg.id_regiao] = { ...reg, count: 0 };
    acc[reg.id_regiao].count += 1;
  });
  return Object.values(acc);
}

function selectRegiaoIniciativas(filtros) {
  const inis = getIniciativasFiltradas(filtros);
  const acc = {};
  inis.forEach(i => { acc[i._macrorregiao] = (acc[i._macrorregiao] || 0) + 1; });
  const total = inis.length || 1;
  return Object.keys(acc).map(nome => ({ nome, valor: acc[nome], pct: acc[nome] / total * 100 })).sort((a, b) => b.valor - a.valor);
}

function selectAbrangencia(filtros) {
  const inis = getIniciativasFiltradas(filtros);
  const acc = {};
  inis.forEach(i => { acc[i.abrangencia_geografica] = (acc[i.abrangencia_geografica] || 0) + 1; });
  return Object.keys(acc).map(nome => ({ nome, valor: acc[nome] })).sort((a, b) => b.valor - a.valor);
}

function selectIniciativasPorAnoApoio(filtros) {
  const inis = getIniciativasFiltradas(filtros);
  const acc = {};
  inis.forEach(i => {

function colorFor(nome, idx) {
  const n = nome || '';
  if (/não informad|não classificado|não haverá/i.test(n)) return COLOR_NAO_INFORMADO;
  if (/não aplicáve/i.test(n)) return COLOR_NAO_APLICAVEL;
  return PALETTE[idx % PALETTE.length];
}

function fmtInt(n) {
  return new Intl.NumberFormat('pt-BR').format(Math.round(n || 0));
}
function fmtCompact(n) {
  n = n || 0;
  if (n >= 1_000_000) return (n / 1_000_000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' Mi';
  if (n >= 1_000) return (n / 1_000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil';
  return fmtInt(n);
}
function fmtBRL(n) {
  return 'R$ ' + new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 }).format(n || 0);
}
function fmtBRLCompact(n) {
  n = n || 0;
  if (n >= 1_000_000) return 'R$ ' + (n / 1_000_000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' Mi';
  if (n >= 1_000) return 'R$ ' + (n / 1_000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil';
  return fmtBRL(n);
}
function fmtPct(n, casas) {
  return (n || 0).toLocaleString('pt-BR', { minimumFractionDigits: casas == null ? 1 : casas, maximumFractionDigits: casas == null ? 1 : casas }) + '%';
}

// --- utilitário: quebra um rótulo em N linhas por largura de caractere, evitando sobreposição ---
function wrapLabel(text, maxChars, maxLines) {
  maxLines = maxLines || 3;
  const words = String(text).split(' ');
  const lines = [];
  let current = '';
  words.forEach(w => {
    const test = current ? current + ' ' + w : w;
    if (test.length > maxChars && current) {
      lines.push(current);
      current = w;
    } else {
      current = test;
    }
  });
  if (current) lines.push(current);
  if (lines.length > maxLines) {
    const kept = lines.slice(0, maxLines);
    let last = kept[maxLines - 1];
    if (last.length > 3) last = last.slice(0, last.length - 1) + '…';
    kept[maxLines - 1] = last;
    return kept;
  }
  return lines;
}

// tick customizado do eixo X (categórico) que renderiza o rótulo em várias linhas
function makeWrappingTick(maxChars, lineHeight) {
  lineHeight = lineHeight || 12;
  return function WrappingTick(props) {
    const { x, y, payload } = props;
    const lines = wrapLabel(payload.value, maxChars);
    return e('g', { transform: 'translate(' + x + ',' + y + ')' },
      lines.map((line, i) => e('text', {
        key: i, x: 0, y: 0, dy: 11 + i * lineHeight, textAnchor: 'middle',
        style: { fontSize: 10, fill: '#6b7a72' },
      }, line))
    );
  };
}

// calcula quantos caracteres por linha cabem, dado o nº de categorias (heurística de largura disponível)
function charBudgetFor(n) {
  if (n <= 3) return 20;
  if (n <= 4) return 16;
  if (n <= 6) return 13;
  if (n <= 8) return 11;
  if (n <= 10) return 9;
  return 8;
}

  const fmt = valueFormatter || ((v) => fmtPct(v, 1));
  if (!data || data.length === 0) {
    return e(Card, null, e(SectionTitle, { title, subtitle }), e(EmptyState, null));
  }
  const total = data.reduce((s, d) => s + d.valor, 0) || 1;
  function renderSliceLabel(props) {
    const { cx, cy, midAngle, outerRadius, value, fill } = props;
    const pct = value / total * 100;
    if (pct < 4) return null; // evita poluição visual em fatias muito pequenas
    const RAD = Math.PI / 180;
    const sin = Math.sin(-midAngle * RAD), cos = Math.cos(-midAngle * RAD);
    const sx = cx + (outerRadius + 4) * cos, sy = cy + (outerRadius + 4) * sin;
    const mx = cx + (outerRadius + 14) * cos, my = cy + (outerRadius + 14) * sin;

    const anchor = cos >= 0 ? 'start' : 'end';
    return e('g', null,

      e('text', { x: ex + (cos >= 0 ? 3 : -3), y: ey, textAnchor: anchor, dominantBaseline: 'central', style: { fontSize: 10.5, fontWeight: 600, fill: '#3a453f' } }, fmtPct(pct, 1))

// projeção equiretangular simples (lon,lat) -> (x,y) dentro de um viewBox fixo
const BRASIL_VIEWBOX = { w: 340, h: 320 };
const BRASIL_BOUNDS = { lonMin: -74.5, lonMax: -34.0, latMin: -34.0, latMax: 5.5 };
function projetar(lat, lon) {
  const x = (lon - BRASIL_BOUNDS.lonMin) / (BRASIL_BOUNDS.lonMax - BRASIL_BOUNDS.lonMin) * BRASIL_VIEWBOX.w;
  const y = (BRASIL_BOUNDS.latMax - lat) / (BRASIL_BOUNDS.latMax - BRASIL_BOUNDS.latMin) * BRASIL_VIEWBOX.h;
  return [x, y];
}

// 11. FILTER BAR — slicers globais (origem do recurso + intervalo de anos)
// ============================================================================
const ORIGENS_RECURSO = T.dim_lista_categorias.filter(c => c.grupo === 'origem_recurso').map(c => c.valor);

function FilterBar({ filtros, setFiltros }) {
  function toggleOrigem(origem) {
    setFiltros(f => {
      const has = f.origens.includes(origem);
      const origens = has ? f.origens.filter(o => o !== origem) : [...f.origens, origem];
      return { ...f, origens };
    });
  }
  function limparOrigens() {
    setFiltros(f => ({ ...f, origens: [] }));
  }
  function setAnoInicio(v) {
    setFiltros(f => ({ ...f, anoInicio: Math.min(v, f.anoFim) }));
  }
  function setAnoFim(v) {
    setFiltros(f => ({ ...f, anoFim: Math.max(v, f.anoInicio) }));
  }

  return e('div', { className: 'bg-brand-cream border border-brand-creamBorder rounded-2xl px-3.5 py-3 md:px-4 md:py-3.5 flex flex-col md:flex-row md:items-center gap-3 md:gap-5' },
    e('div', { className: 'flex items-center gap-1.5 shrink-0 text-brand-orangeDark' },
      e(Icon.Filter, { className: 'w-4 h-4' }),
      e('span', { className: 'text-xs font-semibold uppercase tracking-wide' }, 'Filtros')
    ),
    e('div', { className: 'flex flex-wrap items-center gap-1.5 flex-1 min-w-0' },
      e(Chip, { active: filtros.origens.length === 0, onClick: limparOrigens }, 'Selecionar tudo'),
      ORIGENS_RECURSO.map(o => e(Chip, { key: o, active: filtros.origens.includes(o), onClick: () => toggleOrigem(o) }, o))
    ),
    e('div', { className: 'flex items-center gap-2.5 shrink-0 w-full md:w-[280px]' },
      e('span', { className: 'text-xs font-semibold text-brand-orangeDark tabular-nums w-9' }, filtros.anoInicio),
      e(DualRange, { min: ANO_MIN, max: ANO_MAX, valueMin: filtros.anoInicio, valueMax: filtros.anoFim, onChangeMin: setAnoInicio, onChangeMax: setAnoFim }),
      e('span', { className: 'text-xs font-semibold text-brand-orangeDark tabular-nums w-9 text-right' }, filtros.anoFim)
    )
  );
}

// slider de intervalo (dois inputs range sobrepostos — leve, sem dependências)
function DualRange({ min, max, valueMin, valueMax, onChangeMin, onChangeMax }) {
  const pctMin = (valueMin - min) / (max - min) * 100;
  const pctMax = (valueMax - min) / (max - min) * 100;
  return e('div', { className: 'relative flex-1 h-5 flex items-center' },
    e('div', { className: 'absolute left-0 right-0 h-1.5 bg-white rounded-full' }),
    e('div', { className: 'absolute h-1.5 bg-brand-orange rounded-full', style: { left: pctMin + '%', right: (100 - pctMax) + '%' } }),
    e('input', {
      type: 'range', min, max, value: valueMin,
      onChange: (ev) => onChangeMin(Number(ev.target.value)),
      className: 'range-thumb absolute w-full appearance-none bg-transparent pointer-events-none',
    }),
    e('input', {
      type: 'range', min, max, value: valueMax,
      onChange: (ev) => onChangeMax(Number(ev.target.value)),
      className: 'range-thumb absolute w-full appearance-none bg-transparent pointer-events-none',
    })
  );
}

// 22. PÁGINA — DOAÇÕES DE PRODUTOS
// ============================================================================
const MESES_DISPONIVEIS = Array.from(new Set(T.fact_doacoes_produto.map(d => d.mes_ano))).sort();
const MES_MIN = MESES_DISPONIVEIS[0];
const MES_MAX = MESES_DISPONIVEIS[MESES_DISPONIVEIS.length - 1];

function DoacoesPage() {
  const [mesInicio, setMesInicio] = useState(MES_MIN);
  const [mesFim, setMesFim] = useState(MES_MAX);
  const idxInicio = MESES_DISPONIVEIS.indexOf(mesInicio);
  const idxFim = MESES_DISPONIVEIS.indexOf(mesFim);

  const kpis = useMemo(() => selectDoacoesKpis(mesInicio, mesFim), [mesInicio, mesFim]);
  const categoria = useMemo(() => selectDoacoesPorCategoria(mesInicio, mesFim), [mesInicio, mesFim]);
  const porMes = useMemo(() => selectDoacoesPorMes(mesInicio, mesFim), [mesInicio, mesFim]);
  const faixaUtil = useMemo(() => selectDoacoesFaixaUtilizacao(mesInicio, mesFim), [mesInicio, mesFim]);
  const formaUtil = useMemo(() => selectDoacoesFormaUtilizacao(mesInicio, mesFim), [mesInicio, mesFim]);
  const destinacao = useMemo(() => selectDoacoesDestinacao(mesInicio, mesFim), [mesInicio, mesFim]);
  const mapaCds = useMemo(() => selectDoacoesMapaCds(mesInicio, mesFim), [mesInicio, mesFim]);

  function onChangeIdxInicio(v) { const i = Math.min(Number(v), idxFim); setMesInicio(MESES_DISPONIVEIS[i]); }
  function onChangeIdxFim(v) { const i = Math.max(Number(v), idxInicio); setMesFim(MESES_DISPONIVEIS[i]); }

  // KPI no padrão dos 3 blocos (dark: proponentes+iniciativas / laranja: beneficiários / creme: valor)
  const kpisPadrao = { organizacoes: kpis.organizacoes, iniciativas: kpis.organizacoes, beneficiarios: kpis.quantidade, valor: kpis.valor };

  return e(PageWrap, null,
    e(PageTopSection, { title: 'Doações de Produtos', subtitle: 'Por subcategoria, valor mensal, local de origem, percentual e formas de utilização', kpis: kpisPadrao }),
    e(Grid, { cols: 2 },
      e('div', { className: 'md:col-span-1' }, e(BigNumberCard, { value: fmtCompact(kpis.quantidade), label: 'Quantidade total doada', tone: 'orange' })),
      e('div', { className: 'md:col-span-1 bg-brand-cream border border-brand-creamBorder rounded-2xl px-3.5 py-3 md:px-4 md:py-3.5 flex flex-col md:flex-row md:items-center gap-3 md:gap-5' },
        e('div', { className: 'flex items-center gap-1.5 shrink-0 text-brand-orangeDark' }, e(Icon.Filter, { className: 'w-4 h-4' }), e('span', { className: 'text-xs font-semibold uppercase tracking-wide' }, 'Período')),
        e('div', { className: 'flex items-center gap-2.5 flex-1 w-full' },
          e('span', { className: 'text-xs font-semibold text-brand-orangeDark tabular-nums w-12' }, fmtMesAno(mesInicio)),
          e(DualRange, { min: 0, max: MESES_DISPONIVEIS.length - 1, valueMin: idxInicio, valueMax: idxFim, onChangeMin: onChangeIdxInicio, onChangeMax: onChangeIdxFim }),
          e('span', { className: 'text-xs font-semibold text-brand-orangeDark tabular-nums w-12 text-right' }, fmtMesAno(mesFim))
        )
      )
    ),
    e(Grid, { cols: 2 },
      e(BarChartCard, { title: 'Produtos doados por categoria', data: categoria, colorMode: 'multi', valueFormatter: fmtCompact, height: 260 }),
      e(LineChartCard, { title: 'Valor total doado por mês', data: porMes, xKey: 'mes', yKey: 'valor', xFormatter: fmtMesAno, valueFormatter: fmtBRLCompact, height: 260 })
    ),
    e(Grid, { cols: 2 },
      e(BarChartCard, { title: 'Faixa % de utilização', data: faixaUtil, layout: 'horizontal', height: 220 }),
      e(BarChartCard, { title: 'Destinação dos não utilizados', data: destinacao, layout: 'horizontal', height: 220 })
    ),
    e(BarChartCard, { title: 'Formas de utilização', data: formaUtil, layout: 'horizontal', height: 260 }),
    e(SchematicMap, { title: 'Local de origem (centros de distribuição)', subtitle: 'Tamanho da bolha = nº de remessas do centro de distribuição', points: mapaCds, height: 280, unitLabel: 'remessas' })
  );
}

// 23. PÁGINA — LISTA DE INICIATIVAS E PROJETOS APOIADOS
// ============================================================================
const MODALIDADES = T.dim_lista_categorias.filter(c => c.grupo === 'modalidade_apoio').map(c => c.valor);
const PERFIS_PROPONENTE = T.dim_lista_categorias.filter(c => c.grupo === 'tipo_organizacao').map(c => c.valor);

function Select({ label, value, onChange, options }) {
  return e('label', { className: 'flex flex-col gap-1 text-xs' },
    e('span', { className: 'text-brand-ink/50 font-medium' }, label),
    e('select', {
      value, onChange: (ev) => onChange(ev.target.value),
      className: 'bg-white border border-brand-line rounded-lg px-2.5 py-1.5 text-[13px] text-brand-ink focus:outline-none focus:ring-2 focus:ring-brand-green/30 focus:border-brand-green',
    },
      e('option', { value: 'Todos' }, 'Todos'),
      options.map(o => e('option', { key: o, value: o }, o))
    )
  );
}

function ListaIniciativasPage({ filtros, setFiltros }) {
  const [origem, setOrigem] = useState('Todos');
  const [modalidade, setModalidade] = useState('Todos');
  const [perfil, setPerfil] = useState('Todos');
  const [busca, setBusca] = useState('');
  const [sortKey, setSortKey] = useState('publico_total_atendido');
  const [sortDir, setSortDir] = useState('desc');

  const linhas = useMemo(() => selectListaIniciativas(filtros, { origem, modalidade, perfil, busca }), [filtros, origem, modalidade, perfil, busca]);
  const ordenadas = useMemo(() => {
    const arr = [...linhas];
    arr.sort((a, b) => {
      let va = a[sortKey], vb = b[sortKey];
      if (typeof va === 'string') { va = va.toLowerCase(); vb = vb.toLowerCase(); }
      if (va < vb) return sortDir === 'asc' ? -1 : 1;
      if (va > vb) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
    return arr;
  }, [linhas, sortKey, sortDir]);
  const totalPublico = useMemo(() => linhas.reduce((s, i) => s + i.publico_total_atendido, 0), [linhas]);

  function toggleSort(key) {
    if (sortKey === key) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortKey(key); setSortDir('desc'); }
  }

  const kpis = useMemo(() => selectKpis(filtros), [filtros]);

  const COLS = [
    { key: '_orgNome', label: 'Proponente', align: 'left' },
    { key: 'nome_ficticio_iniciativa', label: 'Nome do projeto e/ou a iniciativa', align: 'left' },
    { key: 'origem_recurso', label: 'Origem do recurso', align: 'left' },
    { key: 'ano_apoio', label: 'Ano de apoio', align: 'right' },
    { key: 'publico_total_atendido', label: 'Público direto atendido', align: 'right' },
  ];

  return e(PageWrap, null,
    e(PageTopSection, { title: 'Lista de Iniciativas e Projetos Apoiados', subtitle: 'Filtre a tabela pelos segmentadores abaixo', kpis }),
    e(Card, { className: 'flex flex-col gap-3' },
      e('div', { className: 'grid grid-cols-2 md:grid-cols-4 gap-3' },
        e(Select, { label: 'Origem do recurso', value: origem, onChange: setOrigem, options: ORIGENS_RECURSO }),
        e(Select, { label: 'Modalidade de apoio', value: modalidade, onChange: setModalidade, options: MODALIDADES }),
        e(Select, { label: 'Perfil do proponente', value: perfil, onChange: setPerfil, options: PERFIS_PROPONENTE }),
        e('label', { className: 'flex flex-col gap-1 text-xs' },
          e('span', { className: 'text-brand-ink/50 font-medium' }, 'Buscar projeto ou proponente'),
          e('div', { className: 'relative' },
            e(Icon.Search, { className: 'w-3.5 h-3.5 text-brand-ink/30 absolute left-2.5 top-1/2 -translate-y-1/2' }),
            e('input', {
              value: busca, onChange: (ev) => setBusca(ev.target.value), placeholder: 'Digite para buscar…',
              className: 'w-full bg-white border border-brand-line rounded-lg pl-7 pr-2.5 py-1.5 text-[13px] focus:outline-none focus:ring-2 focus:ring-brand-green/30 focus:border-brand-green',
            })
          )
        )
      ),
      e('div', { className: 'flex items-center gap-3' },
        e('span', { className: 'text-xs font-semibold text-brand-ink/50 tabular-nums shrink-0' }, filtros.anoInicio),
        e(DualRange, {
          min: ANO_MIN, max: ANO_MAX, valueMin: filtros.anoInicio, valueMax: filtros.anoFim,
          onChangeMin: (v) => setFiltros(f => ({ ...f, anoInicio: Math.min(v, f.anoFim) })),
          onChangeMax: (v) => setFiltros(f => ({ ...f, anoFim: Math.max(v, f.anoInicio) })),
        }),
        e('span', { className: 'text-xs font-semibold text-brand-ink/50 tabular-nums shrink-0' }, filtros.anoFim)
      )
    ),
    e(Card, { padded: false, className: 'overflow-hidden' },
      e('div', { className: 'max-h-[520px] overflow-auto' },
        e('table', { className: 'w-full text-[13px]' },
          e('thead', { className: 'sticky top-0 bg-brand-dark text-white text-xs z-10' },
            e('tr', null,
              COLS.map(c => e('th', {
                key: c.key,
                onClick: () => toggleSort(c.key),
                className: 'cursor-pointer select-none font-medium py-2.5 px-4 whitespace-nowrap ' + (c.align === 'right' ? 'text-right' : 'text-left'),
              },
                e('span', { className: 'inline-flex items-center gap-1' }, c.label, sortKey === c.key ? e(Icon.ChevronDown, { className: 'w-3 h-3 transition-transform ' + (sortDir === 'asc' ? 'rotate-180' : '') }) : null)
              ))
            )
          ),
          e('tbody', null,
            ordenadas.length === 0
              ? e('tr', null, e('td', { colSpan: COLS.length, className: 'py-10 text-center text-brand-ink/40' }, 'Nenhuma iniciativa encontrada para os filtros selecionados'))
              : ordenadas.map((i, idx) => e('tr', { key: i.id_iniciativa, className: 'border-t border-brand-line/70 hover:bg-brand-greenLight/30' },
                  e('td', { className: 'py-2 px-4 text-brand-ink/70' }, i._orgNome),
                  e('td', { className: 'py-2 px-4 text-brand-ink font-medium' }, i.nome_ficticio_iniciativa),
                  e('td', { className: 'py-2 px-4 text-brand-ink/60' }, i.origem_recurso),
                  e('td', { className: 'py-2 px-4 text-right text-brand-ink/60 tabular-nums' }, i.ano_apoio),
                  e('td', { className: 'py-2 px-4 text-right font-semibold text-brand-ink tabular-nums' }, fmtInt(i.publico_total_atendido))
                ))
          ),
          e('tfoot', null,
            e('tr', { className: 'border-t-2 border-brand-green/40 bg-brand-greenLight/40 font-semibold sticky bottom-0' },
              e('td', { className: 'py-2.5 px-4', colSpan: 4 }, 'Total (' + ordenadas.length + ' iniciativas)'),
              e('td', { className: 'py-2.5 px-4 text-right tabular-nums' }, fmtInt(totalPublico))
            )
          )
        )
      )
    )
  );
}
// ============================================================================
// 24. APP ROOT
// ============================================================================
function getPageFromHash() {
  const h = window.location.hash.replace('#', '');
  return h || 'home';
}

function App() {
  const [page, setPageState] = useState(getPageFromHash());
  const [mobileOpen, setMobileOpen] = useState(false);
  const [filtros, setFiltros] = useState(FILTROS_PADRAO);

  function setPage(p) {
    setPageState(p);
    window.location.hash = p;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  useEffect(() => {
    function onHashChange() { setPageState(getPageFromHash()); }
    window.addEventListener('hashchange', onHashChange);
    return () => window.removeEventListener('hashchange', onHashChange);
  }, []);

  // reseta filtros globais ao trocar de página (evita "página em branco" por combinação improvável)
  // mantém o intervalo de anos e origens escolhidos, comportamento cross-page como no Power BI original
  let pageEl;
  switch (page) {
    case 'home': pageEl = e(HomePage, { setPage }); break;
    case 'beneficiarios': pageEl = e(BeneficiariosPage, { filtros, setFiltros }); break;
    case 'organizacoes': pageEl = e(OrganizacoesPage, { filtros, setFiltros }); break;
    case 'atencao': pageEl = e(AtencaoSaudePage, { filtros, setFiltros }); break;
    case 'iniciativas': pageEl = e(IniciativasPage, { filtros, setFiltros }); break;
    case 'alinhamento': pageEl = e(AlinhamentoPage, { filtros, setFiltros }); break;
    case 'temas': pageEl = e(TemasSaudePage, { filtros, setFiltros }); break;
    case 'investimento': pageEl = e(InvestimentoPage, { filtros, setFiltros }); break;
    case 'doacoes': pageEl = e(DoacoesPage, null); break;
    case 'lista': pageEl = e(ListaIniciativasPage, { filtros, setFiltros }); break;
    default: pageEl = e(HomePage, { setPage });
  }

  const isHome = page === 'home';

  return e('div', { className: 'min-h-screen flex bg-brand-paper' },
    !isHome ? e(Sidebar, { page, setPage, mobileOpen, setMobileOpen }) : null,
    e('div', { className: 'flex-1 min-w-0 flex flex-col' },
      !isHome ? e(TopBar, { setMobileOpen, page }) : e('div', { className: 'lg:hidden' }),
      e('main', { className: 'flex-1 px-4 md:px-7 py-5 md:py-6 max-w-[1400px] w-full mx-auto' },
        pageEl,
        !isHome ? e(Footer, null) : null
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App, null));

</script>
